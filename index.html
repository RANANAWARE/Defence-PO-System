<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MB PDF Extractor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>MB PDF Extractor</h1>
        <p class="subtitle">
            Upload one or more Defence purchase order PDFs. The tool extracts PO Number,
            PO Line, Part Number, NSN, Description, Quantity, CoA value and EDD.
        </p>

        <section class="upload-box" aria-label="PDF upload controls">
            <label class="file-label" for="pdfFile">Select purchase order PDFs</label>
            <input type="file" id="pdfFile" accept="application/pdf,.pdf" multiple>
            <div class="button-row">
                <button id="extractButton" type="button">Extract Data</button>
                <button id="downloadButton" type="button" disabled>Download Excel</button>
                <button id="clearButton" class="secondary" type="button">Clear</button>
            </div>
        </section>

        <div class="summary" id="summaryText" role="status" aria-live="polite">
            No PDF selected yet.
        </div>

        <div class="table-wrapper">
            <table id="resultTable">
                <thead>
                    <tr>
                        <th>PO Number</th>
                        <th>PO Line</th>
                        <th>Part Number</th>
                        <th>NSN</th>
                        <th>Description</th>
                        <th>Qty</th>
                        <th>CoA $</th>
                        <th>EDD</th>
                        <th>Source PDF</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
